name: Build MinimalPDF APK
on:
  push:
    branches:
      - 'apk/minimalpdf'
    paths:
      - 'tools/minimalpdf/**'
      - '.github/workflows/minimalpdf-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMGR="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p tools/minimalpdf --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalPDF-APK
          path: tools/minimalpdf/app/build/outputs/apk/debug/app-debug.apk
