name: Build APK

on:
  push:
    branches: [main, dev/v1.11-reading-workflow]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMGR="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalPDF-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct-install APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          test -n "$VERSION"
          TAG="v${VERSION}"
          ASSET="MinimalPDF-v${VERSION}.apk"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK}#${ASSET}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${APK}#${ASSET}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Minimal PDF v${VERSION}" \
              --notes "Direct-download Android APK. Install on Android 8.0 or later. This APK is an automated debug build." \
              --target "$GITHUB_SHA"
          fi
